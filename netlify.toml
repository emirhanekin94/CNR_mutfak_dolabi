[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self' https: data: blob: 'unsafe-inline'; img-src 'self' https: data: blob: https://www.google-analytics.com https://www.googletagmanager.com; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; media-src 'self' https: blob:; connect-src 'self' https: https://www.google-analytics.com https://analytics.google.com https://*.googletagmanager.com; frame-ancestors 'self';"

[[redirects]]
  from = "http://mutfakdolabiniz.com.tr/*"
  to = "https://mutfakdolabiniz.com.tr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.mutfakdolabiniz.com.tr/*"
  to = "https://mutfakdolabiniz.com.tr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.mutfakdolabiniz.com.tr/*"
  to = "https://mutfakdolabiniz.com.tr/:splat"
  status = 301
  force = true
